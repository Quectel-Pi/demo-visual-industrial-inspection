name: Clean install and regression tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install using the public installer
        run: ./install.sh
      - name: Shell syntax
        run: bash -n install.sh run.sh launch_device.sh
      - name: Regression tests and command-line startup
        run: .venv/bin/python -m unittest -q test_engine test_decisions test_live